{% extends "base.html" %}

{% block title %}Add Book{% endblock %}

{% block content %}
    <section class="form-panel">
        <p class="eyebrow">BOOK COLLECTION</p>
        <h1>Add a new book</h1>
        <p class="muted">Enter the details below to add a book to your library.</p>

        <form method="POST" class="book-form">
            <label>Book title</label>
            <input type="text" name="title" placeholder="e.g. Python Basics" required>

            <label>Author</label>
            <input type="text" name="author" placeholder="e.g. John Smith" required>

            <label>Category</label>
            <input type="text" name="category" placeholder="e.g. Programming" required>

            <label>Quantity</label>
            <input type="number" name="quantity" min="0" value="1" required>

            <div class="form-actions">
                <button class="button" type="submit">Save book</button>
                <a class="button secondary" href="{{ url_for('home') }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
